api:
  insecure: false
  dashboard: true
  disabledashboardad: true
  dashboardName: 'Server name'
  basePath: '/router'

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    observability:
      accessLogs: false
      tracing: false
      metrics: false
  websecure:
    address: ':443'
    asDefault: true
    http:
      tls: {}

certificatesResolvers:
  lets:
    acme:
      email: 'cert@example.com'
      storage: '/etc/traefik/certs.json'
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 120
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'

providers:
  docker:
    watch: true
    network: server_network
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
  file:
    directory: '/etc/traefik'

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN
  format: json
  maxSize: 50
  maxBackups: 5
  filePath: '/var/log/traefik/dashboard.log'

accessLog:
  format: json
  bufferingSize: 100
  filePath: '/var/log/traefik/access.log'
